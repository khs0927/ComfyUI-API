name: Video controller CI

on:
  push:
    branches:
      - agent/unlimited-ai-video-mcp
  pull_request:
    paths:
      - "__init__.py"
      - "video_engine/**"
      - "workers/**"
      - "scripts/**"
      - "tests/**"
      - "video_api.py"
      - "video_mcp_server.py"
      - "requirements-video.txt"
      - "requirements-beam.txt"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          pip install -q fastapi uvicorn pydantic httpx mcp python-multipart sse-starlette huggingface-hub pytest ruff pyyaml
      - name: Compile and lint
        run: |
          ruff check --select E9,F63,F7,F82 __init__.py video_engine video_api.py video_mcp_server.py tests workers scripts
          python -m compileall -q __init__.py video_engine video_api.py video_mcp_server.py tests workers scripts
      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          workflows = sorted(pathlib.Path('.github/workflows').glob('*.yml'))
          assert workflows, 'No workflow files found'
          for path in workflows:
              with path.open(encoding='utf-8') as handle:
                  payload = yaml.safe_load(handle)
              assert isinstance(payload, dict), f'{path} did not parse to a mapping'
              assert 'jobs' in payload, f'{path} has no jobs mapping'
              print(f'YAML OK: {path}')
          PY
      - name: Capture GitHub Actions validation
        id: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          set +e
          "$(go env GOPATH)/bin/actionlint" -no-color > actionlint.log 2>&1
          status=$?
          set -e
          cat actionlint.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload actionlint diagnostics
        if: ${{ steps.actionlint.outputs.status != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: actionlint-diagnostics
          path: actionlint.log
      - name: Enforce GitHub Actions validation
        run: test "${{ steps.actionlint.outputs.status }}" = "0"
      - name: Run unit tests
        run: pytest -q tests
