name: Video controller CI

on:
  push:
    branches:
      - agent/unlimited-ai-video-mcp
  pull_request:
    paths:
      - "__init__.py"
      - "video_engine/**"
      - "workers/**"
      - "tests/**"
      - "video_api.py"
      - "video_mcp_server.py"
      - "requirements-video.txt"
      - ".github/workflows/video-controller.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          pip install -q fastapi uvicorn pydantic httpx mcp python-multipart sse-starlette huggingface-hub pytest ruff
      - name: Compile and lint
        run: |
          ruff check --select E9,F63,F7,F82 __init__.py video_engine video_api.py video_mcp_server.py tests workers
          python -m compileall -q __init__.py video_engine video_api.py video_mcp_server.py tests workers
      - name: Run unit tests
        run: pytest -q tests
