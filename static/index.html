<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HS Unlimited AI Video Serverless Dashboard</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1; /* Indigo */
            --accent-secondary: #8b5cf6; /* Violet */
            --accent-success: #10b981; /* Emerald */
            --accent-warning: #f59e0b; /* Amber */
            --accent-danger: #ef4444; /* Rose */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-outfit: 'Outfit', 'Inter', sans-serif;
            --font-inter: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-inter);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        /* Glassmorphism Card Style */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Header Style */
        header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            margin-top: 10px;
        }

        h1 {
            font-family: var(--font-outfit);
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.2px;
        }

        textarea, input[type="text"], input[type="password"], select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            padding: 12px;
            font-family: var(--font-inter);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        textarea:focus, input[type="text"]:focus, input[type="password"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-family: var(--font-outfit);
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
        }

        .btn-outline-danger {
            background: transparent;
            border: 1px solid var(--accent-danger);
            color: var(--accent-danger);
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            width: fit-content;
        }

        .btn-outline-danger:active {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Settings Gear */
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .settings-toggle {
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-panel {
            display: none;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 12px;
        }

        /* Video List Items */
        .video-list-header {
            font-family: var(--font-outfit);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .job-card {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .job-card:last-child {
            margin-bottom: 0;
        }

        .job-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .job-id {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .job-status {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .status-queued { background: rgba(245, 158, 11, 0.15); color: var(--accent-warning); }
        .status-running { background: rgba(99, 102, 241, 0.15); color: var(--accent-primary); animation: pulse-blue 2s infinite; }
        .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--accent-success); }
        .status-failed { background: rgba(239, 68, 68, 0.15); color: var(--accent-danger); }

        .job-prompt {
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text-main);
            word-break: break-word;
        }

        .job-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Inline Video Player */
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid var(--border-color);
            background: black;
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 8px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            width: fit-content;
            margin-top: 4px;
            transition: background 0.2s;
        }

        .download-link:active {
            background: rgba(99, 102, 241, 0.2);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 20px 0;
        }

        @keyframes pulse-blue {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>HS Serverless Video</h1>
            <div class="subtitle">모바일 비디오 생성 제어판 (완전 서버리스)</div>
        </header>

        <!-- GitHub API Configuration Card -->
        <div class="card">
            <div class="settings-header">
                <label style="font-size:0.95rem; font-weight:700;">🐙 GitHub 연동 설정</label>
                <button class="settings-toggle" id="settings-toggle">⚙️</button>
            </div>
            <div id="settings-panel" class="settings-panel" style="display: block;">
                <div class="form-group">
                    <label for="github-token">GitHub Personal Access Token (PAT)</label>
                    <input type="password" id="github-token" placeholder="ghp_ 또는 gho_ 토큰을 입력하세요" />
                </div>
                <div class="form-group">
                    <label for="github-repo">GitHub Repository</label>
                    <input type="text" id="github-repo" value="khs0927/ComfyUI-API" />
                </div>
                <div class="form-group" style="font-size: 0.75rem; color: var(--text-muted); margin-top:-8px;">
                    * 토큰은 브라우저 안전 영역(localStorage)에만 보관되며, 깃허브 API 호출 시 직접 사용됩니다.
                </div>
            </div>
        </div>

        <!-- Request Form Card -->
        <div class="card">
            <form id="video-form">
                <div class="form-group">
                    <label for="prompt">비주얼 프롬프트 (Visual Prompt)</label>
                    <textarea id="prompt" placeholder="생성할 영상의 세부 묘사를 영어로 작성해 주세요..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="script">나레이션/스크립트 (선택 사항)</label>
                    <textarea id="script" placeholder="나레이션이 필요한 경우 텍스트를 입력해 주세요..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="provider">비디오 공급자</label>
                        <select id="provider">
                            <option value="auto" selected>자동 (Auto Fallback)</option>
                            <option value="beam">Beam Cloud</option>
                            <option value="kaggle">Kaggle GPU</option>
                            <option value="hf">Hugging Face</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="duration">총 길이 (분)</label>
                        <select id="duration">
                            <option value="0.1">5초 (테스트용)</option>
                            <option value="0.5">30초</option>
                            <option value="1.0" selected>1분 (표준)</option>
                            <option value="3.0">3분</option>
                            <option value="5.0">5분</option>
                            <option value="10.0">10분</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="aspect-ratio">화면 비율</label>
                        <select id="aspect-ratio">
                            <option value="16:9" selected>가로형 (16:9)</option>
                            <option value="9:16">세로형 (9:16)</option>
                            <option value="1:1">정사각형 (1:1)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fps">초당 프레임 (FPS)</label>
                        <select id="fps">
                            <option value="24" selected>24 FPS</option>
                            <option value="30">30 FPS</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn">
                    🚀 GitHub 원격 생성 요청
                </button>
            </form>
        </div>

        <!-- Video History & Queue Card -->
        <div class="card">
            <div class="video-list-header">
                <span>📋 원격 생성 기록 & 상태</span>
                <button class="refresh-btn" id="refresh-btn">새로고침 🔄</button>
            </div>
            <div id="job-list">
                <div class="empty-state">로딩 중...</div>
            </div>
        </div>
    </div>

    <script>
        // Init DOM references
        const githubTokenInput = document.getElementById('github-token');
        const githubRepoInput = document.getElementById('github-repo');
        const settingsToggle = document.getElementById('settings-toggle');
        const settingsPanel = document.getElementById('settings-panel');
        const videoForm = document.getElementById('video-form');
        const jobListDiv = document.getElementById('job-list');
        const refreshBtn = document.getElementById('refresh-btn');

        // Load config from localStorage
        const storedToken = localStorage.getItem('gh_video_token');
        const storedRepo = localStorage.getItem('gh_video_repo');
        
        if (storedToken) {
            githubTokenInput.value = storedToken;
            settingsPanel.style.display = 'none'; // Collapse if configured
        }
        if (storedRepo) {
            githubRepoInput.value = storedRepo;
        }

        // Toggle settings
        settingsToggle.addEventListener('click', () => {
            const isVisible = settingsPanel.style.display !== 'none';
            settingsPanel.style.display = isVisible ? 'none' : 'block';
        });

        // Save token and repo on change
        githubTokenInput.addEventListener('input', () => {
            localStorage.setItem('gh_video_token', githubTokenInput.value.trim());
        });
        githubRepoInput.addEventListener('input', () => {
            localStorage.setItem('gh_video_repo', githubRepoInput.value.trim());
        });

        // Helper: Headers builder
        function getHeaders() {
            const token = githubTokenInput.value.trim();
            const headers = {
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };
            if (token) {
                headers['Authorization'] = `token ${token}`;
            }
            return headers;
        }

        // Fetch Recent Video Issues
        async function fetchJobs() {
            const repo = githubRepoInput.value.trim();
            if (!repo) return;

            try {
                // Fetch issues starting with [video]
                const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=all&per_page=20`, {
                    headers: getHeaders()
                });

                if (res.ok) {
                    const issues = await res.json();
                    const videoIssues = issues.filter(issue => issue.title.startsWith('[video]'));
                    await renderIssues(videoIssues);
                } else if (res.status === 401 || res.status === 403) {
                    jobListDiv.innerHTML = '<div class="empty-state" style="color:var(--accent-danger)">GitHub Token 권한이 없거나 만료되었습니다. 설정을 확인해 주세요.</div>';
                } else {
                    jobListDiv.innerHTML = '<div class="empty-state">기록을 불러오지 못했습니다.</div>';
                }
            } catch (err) {
                jobListDiv.innerHTML = '<div class="empty-state">네트워크 오류</div>';
            }
        }

        // Render Issue/Job Cards
        async function renderIssues(issues) {
            if (issues.length === 0) {
                jobListDiv.innerHTML = '<div class="empty-state">생성된 영상 작업이 없습니다.</div>';
                return;
            }

            jobListDiv.innerHTML = '';
            
            for (const issue of issues) {
                const card = document.createElement('div');
                card.className = 'job-card';

                // We will determine status by checking issue state, actions runs or comments
                let state = issue.state === 'closed' ? 'completed' : 'queued';
                let message = '대기 중...';
                let progressVal = 0;
                let videoUrl = null;
                let runUrl = null;

                // Load comments to see if action posted progress or completion details
                try {
                    const commentsRes = await fetch(issue.comments_url, { headers: getHeaders() });
                    if (commentsRes.ok) {
                        const comments = await commentsRes.json();
                        
                        // Parse comments for updates
                        for (const comment of comments) {
                            const body = comment.body || '';
                            if (body.includes('원격 영상 작업을 시작했습니다')) {
                                state = 'running';
                                message = '비디오 생성 엔진 시작됨';
                                progressVal = 10;
                                const runMatch = body.match(/actions\/runs\/(\d+)/);
                                if (runMatch) {
                                    runUrl = body.substring(body.indexOf('https://'));
                                }
                            }
                            if (body.includes('영상 생성이 완료되었습니다')) {
                                state = 'completed';
                                message = '생성 완료';
                                progressVal = 100;
                                const urlMatch = body.match(/https:\/\/raw\.githubusercontent\.com[^\s]+/);
                                if (urlMatch) {
                                    videoUrl = urlMatch[0];
                                }
                            }
                            if (body.includes('영상 작업이 실패했습니다')) {
                                state = 'failed';
                                message = '작업 실패 (GPU 할당량 또는 비밀키 확인)';
                                progressVal = 0;
                            }
                        }
                    }
                } catch (e) {
                    console.error('Failed to load comments', e);
                }

                // If closed but no video URL was successfully parsed, treat it as failed or closed without artifacts
                if (issue.state === 'closed' && state !== 'completed' && state !== 'failed') {
                    state = 'failed';
                    message = '비정상 종료';
                }

                const meta = document.createElement('div');
                meta.className = 'job-meta';
                meta.innerHTML = `
                    <span class="job-id">이슈 #${issue.number}</span>
                    <span class="job-status status-${state}">${state}</span>
                `;
                card.appendChild(meta);

                const prompt = document.createElement('div');
                prompt.className = 'job-prompt';
                prompt.textContent = issue.title.replace('[video]', '').trim();
                card.appendChild(prompt);

                const details = document.createElement('div');
                details.className = 'job-details';
                const formattedTime = new Date(issue.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                details.innerHTML = `
                    <span>🕒 ${formattedTime}</span>
                    <span>💬 댓글 ${issue.comments}개</span>
                `;
                card.appendChild(details);

                // Progress Bar (if running/queued)
                if (['queued', 'running'].includes(state)) {
                    const textRow = document.createElement('div');
                    textRow.className = 'progress-text';
                    textRow.innerHTML = `
                        <span>${message}</span>
                        <span>${progressVal}%</span>
                    `;
                    card.appendChild(textRow);

                    const pContainer = document.createElement('div');
                    pContainer.className = 'progress-container';
                    pContainer.innerHTML = `<div class="progress-bar" style="width: ${progressVal}%"></div>`;
                    card.appendChild(pContainer);

                    // Add button to check Actions log
                    if (runUrl) {
                        const linkRow = document.createElement('div');
                        linkRow.style.marginTop = '8px';
                        const a = document.createElement('a');
                        a.href = runUrl;
                        a.target = '_blank';
                        a.className = 'download-link';
                        a.style.background = 'rgba(99, 102, 241, 0.05)';
                        a.innerHTML = '🔍 Actions 로그 실시간 보기';
                        linkRow.appendChild(a);
                        card.appendChild(linkRow);
                    }
                }

                // Video Player & Download link (if completed)
                if (state === 'completed' && videoUrl) {
                    const player = document.createElement('video');
                    player.src = videoUrl;
                    player.controls = true;
                    player.preload = 'metadata';
                    player.playsInline = true;
                    card.appendChild(player);

                    const dLink = document.createElement('a');
                    dLink.href = videoUrl;
                    dLink.className = 'download-link';
                    dLink.innerHTML = '💾 비디오 다운로드';
                    dLink.download = `video-${issue.number}.mp4`;
                    card.appendChild(dLink);
                }

                // If failed, show check actions link
                if (state === 'failed') {
                    const textRow = document.createElement('div');
                    textRow.className = 'progress-text';
                    textRow.innerHTML = `<span style="color:var(--accent-danger);">${message}</span>`;
                    card.appendChild(textRow);
                }

                // Close Issue button if open (to cancel)
                if (issue.state === 'open') {
                    const actionsRow = document.createElement('div');
                    actionsRow.style.marginTop = '8px';
                    actionsRow.style.display = 'flex';
                    actionsRow.style.justifyContent = 'flex-end';
                    
                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'btn-outline-danger';
                    cancelBtn.textContent = '⛔ 생성 중단 (이슈 닫기)';
                    cancelBtn.onclick = () => closeIssue(issue.number);
                    actionsRow.appendChild(cancelBtn);
                    card.appendChild(actionsRow);
                }

                jobListDiv.appendChild(card);
            }
        }

        // Close Issue (Cancel Job)
        async function closeIssue(number) {
            const repo = githubRepoInput.value.trim();
            if (!confirm('이 영상 생성을 중단하시겠습니까? (이슈가 닫히면 빌드가 중단됩니다)')) return;
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/issues/${number}`, {
                    method: 'PATCH',
                    headers: getHeaders(),
                    body: JSON.stringify({ state: 'closed' })
                });
                if (res.ok) {
                    alert('성공적으로 중단되었습니다.');
                    fetchJobs();
                } else {
                    alert('중단 요청에 실패했습니다.');
                }
            } catch (err) {
                alert('네트워크 오류');
            }
        }

        // Form Submit Handler (Create Issue)
        videoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const repo = githubRepoInput.value.trim();
            const token = githubTokenInput.value.trim();
            if (!token) {
                alert('GitHub Token을 먼저 입력해 주세요.');
                settingsPanel.style.display = 'block';
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ GitHub 이슈 생성 중...';

            const requestData = {
                prompt: document.getElementById('prompt').value.trim(),
                script: document.getElementById('script').value.trim() || undefined,
                target_duration_minutes: parseFloat(document.getElementById('duration').value),
                scene_seconds: 90,
                provider: document.getElementById('provider').value,
                aspect_ratio: document.getElementById('aspect-ratio').value,
                width: 960,
                height: 544,
                fps: parseInt(document.getElementById('fps').value)
            };

            // Calculate resolutions
            if (requestData.aspect_ratio === '9:16') {
                requestData.width = 544;
                requestData.height = 960;
            } else if (requestData.aspect_ratio === '1:1') {
                requestData.width = 720;
                requestData.height = 720;
            }

            const issueTitle = `[video] ${requestData.prompt.substring(0, 30)}...`;
            const issueBody = `\`\`\`json\n${JSON.stringify(requestData, null, 2)}\n\`\`\``;

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/issues`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        title: issueTitle,
                        body: issueBody
                    })
                });

                if (res.ok) {
                    document.getElementById('prompt').value = '';
                    document.getElementById('script').value = '';
                    settingsPanel.style.display = 'none';
                    fetchJobs();
                    alert('성공적으로 영상 생성이 요청되었습니다! (잠시 후 깃허브 Actions 빌드가 자동으로 시작됩니다)');
                } else {
                    const data = await res.json();
                    alert(`요청 오류: ${data.message || '이슈 생성을 하지 못했습니다.'}`);
                }
            } catch (err) {
                alert('네트워크 오류');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 GitHub 원격 생성 요청';
            }
        });

        // Refresh triggers
        refreshBtn.addEventListener('click', fetchJobs);

        // Init & Poll every 10 seconds (higher timeout to avoid GitHub rate limits)
        fetchJobs();
        setInterval(fetchJobs, 10000);
    </script>
</body>
</html>
